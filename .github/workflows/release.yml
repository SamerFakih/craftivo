name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v1.0.0)"
        required: true
        type: string

env:
  NODE_VERSION: "20"

jobs:
  build-and-release:
    name: Build and Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd "craftivo-client" && npm ci
          cd "../craftivo server" && npm ci

      - name: Generate Prisma Client
        working-directory: craftivo server
        run: npm run prisma:gen

      - name: Build backend
        working-directory: craftivo server
        run: npm run build

      - name: Build frontend
        working-directory: craftivo-client
        run: npm run build -- --configuration=production

      - name: Create release package
        run: |
          mkdir -p release-package/backend
          mkdir -p release-package/frontend

          # Copy backend build
          cp -r "craftivo server/dist"/* release-package/backend/
          cp "craftivo server/package.json" release-package/backend/
          cp "craftivo server/prisma/schema.prisma" release-package/backend/

          # Copy frontend build
          cp -r craftivo-client/dist/* release-package/frontend/

          # Create deployment instructions
          echo "# Craftivo Release Package" > release-package/README.md
          echo "" >> release-package/README.md
          echo "## Backend Deployment" >> release-package/README.md
          echo "1. Install dependencies: \`npm install --production\`" >> release-package/README.md
          echo "2. Set environment variables" >> release-package/README.md
          echo "3. Run database migrations: \`npx prisma migrate deploy\`" >> release-package/README.md
          echo "4. Start the server: \`node main.js\`" >> release-package/README.md
          echo "" >> release-package/README.md
          echo "## Frontend Deployment" >> release-package/README.md
          echo "1. Serve the files from the frontend directory" >> release-package/README.md
          echo "2. Configure your web server to serve index.html for all routes" >> release-package/README.md

          # Create version info
          echo "Backend Version: $(node -p "require('./craftivo server/package.json').version")" > release-package/VERSION.txt
          echo "Frontend Version: $(node -p "require('./craftivo-client/package.json').version")" >> release-package/VERSION.txt
          echo "Build Date: $(date)" >> release-package/VERSION.txt
          echo "Git Commit: $(git rev-parse --short HEAD)" >> release-package/VERSION.txt

      - name: Create release archive
        run: |
          cd release-package
          tar -czf ../craftivo-release-${{ github.ref_name }}.tar.gz .
          cd ..
          zip -r craftivo-release-${{ github.ref_name }}.zip release-package/

      - name: Generate changelog
        run: |
          echo "# Changelog for ${{ github.ref_name }}" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "## What's Changed" >> CHANGELOG.md
          git log --oneline --pretty=format:"- %s" $(git describe --tags --abbrev=0 HEAD^)..HEAD >> CHANGELOG.md || echo "- Initial release" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "HEAD")...${{ github.ref_name }}" >> CHANGELOG.md

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Craftivo ${{ github.ref_name }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}

      - name: Upload Release Assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: craftivo-release-${{ github.ref_name }}.tar.gz
          asset_name: craftivo-release-${{ github.ref_name }}.tar.gz
          asset_content_type: application/gzip

      - name: Upload Release ZIP
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: craftivo-release-${{ github.ref_name }}.zip
          asset_name: craftivo-release-${{ github.ref_name }}.zip
          asset_content_type: application/zip

      - name: Upload to artifact store
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            craftivo-release-${{ github.ref_name }}.tar.gz
            craftivo-release-${{ github.ref_name }}.zip
            CHANGELOG.md
          retention-days: 90
