name: CI/CD Pipeline

on:
  push:
    branches: [main, dev, develop]
  pull_request:
    branches: [main, dev, develop]

env:
  NODE_VERSION: "20"

jobs:
  # Job 1: Install dependencies and cache
  setup:
    name: Setup and Cache Dependencies
    runs-on: ubuntu-latest

    outputs:
      frontend-cache-key: ${{ steps.frontend-cache.outputs.cache-hit }}
      backend-cache-key: ${{ steps.backend-cache.outputs.cache-hit }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache frontend dependencies
        id: frontend-cache
        uses: actions/cache@v4
        with:
          path: |
            craftivo-client/node_modules
            ~/.npm
          key: frontend-deps-${{ runner.os }}-${{ hashFiles('craftivo-client/package-lock.json') }}
          restore-keys: |
            frontend-deps-${{ runner.os }}-

      - name: Cache backend dependencies
        id: backend-cache
        uses: actions/cache@v4
        with:
          path: |
            craftivo server/node_modules
            ~/.npm
          key: backend-deps-${{ runner.os }}-${{ hashFiles('craftivo server/package-lock.json') }}
          restore-keys: |
            backend-deps-${{ runner.os }}-

      - name: Install frontend dependencies
        if: steps.frontend-cache.outputs.cache-hit != 'true'
        working-directory: craftivo-client
        run: npm ci

      - name: Install backend dependencies
        if: steps.backend-cache.outputs.cache-hit != 'true'
        working-directory: craftivo server
        run: npm ci

  # Job 2: Backend Tests and Build
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    needs: setup

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: craftivo_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://testuser:testpass@localhost:5432/craftivo_test
      NODE_ENV: test
      JWT_SECRET: test-secret-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore backend dependencies
        uses: actions/cache@v4
        with:
          path: |
            craftivo server/node_modules
            ~/.npm
          key: backend-deps-${{ runner.os }}-${{ hashFiles('craftivo server/package-lock.json') }}

      - name: Install dependencies (if cache miss)
        working-directory: craftivo server
        run: npm ci

      - name: Generate Prisma Client
        working-directory: craftivo server
        run: npm run prisma:gen

      - name: Run database migrations
        working-directory: craftivo server
        run: npm run db:push

      - name: Lint backend code
        working-directory: craftivo server
        run: npm run lint

      - name: Run backend unit tests
        working-directory: craftivo server
        run: npm run test:cov

      - name: Run backend e2e tests
        working-directory: craftivo server
        run: npm run test:e2e

      - name: Build backend
        working-directory: craftivo server
        run: npm run build

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: craftivo server/coverage/

      - name: Upload backend build
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: craftivo server/dist/

  # Job 3: Frontend Tests and Build
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    needs: setup

    strategy:
      matrix:
        browser: [ChromeHeadless, FirefoxHeadless]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore frontend dependencies
        uses: actions/cache@v4
        with:
          path: |
            craftivo-client/node_modules
            ~/.npm
          key: frontend-deps-${{ runner.os }}-${{ hashFiles('craftivo-client/package-lock.json') }}

      - name: Install dependencies (if cache miss)
        working-directory: craftivo-client
        run: npm ci

      - name: Lint frontend code
        working-directory: craftivo-client
        run: npm run ng lint || echo "Linting not configured"

      - name: Run frontend unit tests
        working-directory: craftivo-client
        run: npm run test -- --browsers=${{ matrix.browser }} --watch=false --code-coverage

      - name: Build frontend (development)
        working-directory: craftivo-client
        run: npm run build -- --configuration=development

      - name: Build frontend (production)
        working-directory: craftivo-client
        run: npm run build -- --configuration=production

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-${{ matrix.browser }}
          path: craftivo-client/coverage/

      - name: Upload frontend build
        if: matrix.browser == 'ChromeHeadless'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: craftivo-client/dist/

  # Job 4: Security and Quality Checks
  security:
    name: Security & Quality
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          cd "craftivo-client" && npm ci
          cd "../craftivo server" && npm ci

      - name: Run npm audit (backend)
        working-directory: craftivo server
        run: npm audit --audit-level=moderate || true

      - name: Run npm audit (frontend)
        working-directory: craftivo-client
        run: npm audit --audit-level=moderate || true

      - name: Check for outdated packages (backend)
        working-directory: craftivo server
        run: npm outdated || true

      - name: Check for outdated packages (frontend)
        working-directory: craftivo-client
        run: npm outdated || true

  # Job 5: Integration Tests (if both backend and frontend build successfully)
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: success()

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: craftivo_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://testuser:testpass@localhost:5432/craftivo_test
      NODE_ENV: test
      JWT_SECRET: test-secret-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download backend build
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: craftivo server/dist/

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: craftivo-client/dist/

      - name: Install production dependencies
        run: |
          cd "craftivo server" && npm ci --only=production

      - name: Setup test database
        working-directory: craftivo server
        run: |
          npm run prisma:gen
          npm run db:push

      - name: Start backend server
        working-directory: craftivo server
        run: |
          npm run start:prod &
          sleep 30

      - name: Serve frontend
        working-directory: craftivo-client
        run: |
          npx http-server dist/craftivo-client/browser -p 4200 &
          sleep 10

      - name: Run basic integration tests
        run: |
          # Test backend health
          curl -f http://localhost:3000/health || exit 1

          # Test frontend loads
          curl -f http://localhost:4200 || exit 1

          echo "Integration tests passed!"

  # Job 6: Deployment Preparation (only on main branch)
  deploy-prep:
    name: Deployment Preparation
    runs-on: ubuntu-latest
    needs: [integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create deployment package
        run: |
          mkdir -p deployment/
          cp -r artifacts/backend-build deployment/backend
          cp -r artifacts/frontend-build deployment/frontend

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: deployment/
          retention-days: 30

  # Summary job
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [backend, frontend, security]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "Backend: ${{ needs.backend.result }}"
          echo "Frontend: ${{ needs.frontend.result }}"
          echo "Security: ${{ needs.security.result }}"

          if [[ "${{ needs.backend.result }}" == "failure" || "${{ needs.frontend.result }}" == "failure" || "${{ needs.security.result }}" == "failure" ]]; then
            echo "❌ CI Pipeline failed"
            exit 1
          else
            echo "✅ CI Pipeline successful"
          fi
