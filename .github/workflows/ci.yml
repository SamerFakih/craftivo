name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Angular (craftivo-client)
      - name: Setup Node.js for Angular
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: ./craftivo-client/package-lock.json

      - name: Install Angular dependencies
        working-directory: ./craftivo-client
        run: npm ci

      - name: Test Angular
        working-directory: ./craftivo-client
        run: npm run test -- --watch=false --browsers=ChromeHeadless

      - name: Build Angular
        working-directory: ./craftivo-client
        run: npm run build -- --configuration=production

      # NestJS (craftivo-server)
      - name: Setup Node.js for NestJS
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: ./craftivo-server/package-lock.json

      - name: Install NestJS dependencies
        working-directory: ./craftivo-server
        run: npm ci

      - name: Test NestJS
        working-directory: ./craftivo-server
        run: npm run test -- --ci --coverage

      - name: Build NestJS
        working-directory: ./craftivo-server
        run: npm run build
