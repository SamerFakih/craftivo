name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # -------------------------
      # Client (Angular)
      # -------------------------
      - name: Cache Angular dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-angular-${{ hashFiles('craftivo-client/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-angular-

      - name: Install Angular dependencies
        working-directory: craftivo-client
        run: npm ci

      - name: Build Angular app
        working-directory: craftivo-client
        run: npm run build --if-present

      # -------------------------
      # Server (NestJS)
      # -------------------------
      - name: Cache NestJS dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-nest-${{ hashFiles('craftivo-server/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nest-

      - name: Install NestJS dependencies
        working-directory: craftivo-server
        run: npm ci

      - name: Build NestJS app
        working-directory: craftivo-server
        run: npm run build --if-present
