name: CI

on:
  push:
    branches: [main, dev, develop]
  pull_request:
    branches: [main, dev, develop]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: craftivo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" \
          --health-interval 5s \
          --health-timeout 5s \
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/craftivo?schema=public
      PRISMA_CLIENT_ENGINE_TYPE: library
      JWT_SECRET: test-secret-key-1234567890
      NODE_ENV: test
      CI: true
    steps:
      - uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'craftivo server/package-lock.json'
      - name: Install deps
        working-directory: craftivo server
        run: npm ci
      - name: Generate Prisma client
        working-directory: craftivo server
        run: npx prisma generate
      - name: Run migrations
        working-directory: craftivo server
        run: npx prisma migrate deploy
      - name: Unit tests
        working-directory: craftivo server
        run: npm test -- --runInBand
      - name: E2E tests
        working-directory: craftivo server
        run: npm run test:e2e -- --runInBand
      - name: Build
        working-directory: craftivo server
        run: npm run build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'craftivo-client/package-lock.json'
      - name: Install deps
        working-directory: craftivo-client
        run: npm ci || npm install
      - name: Unit tests
        working-directory: craftivo-client
        run: npm test -- --watch=false --browsers=ChromeHeadless
      - name: Build (SSR)
        working-directory: craftivo-client
        run: npm run build

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - run: echo "Backend: ${{ needs.backend.result }} | Frontend: ${{ needs.frontend.result }}"
