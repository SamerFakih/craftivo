name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      # -------------------------
      # 1. Checkout code
      # -------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------
      # 2. Angular (craftivo-client)
      # -------------------------
      - name: Setup Node.js for Angular
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: craftivo-client/package-lock.json

      - name: Install Angular dependencies
        working-directory: ./craftivo-client
        run: npm ci

      - name: Build Angular app
        working-directory: ./craftivo-client
        run: npm run build --if-present

      # -------------------------
      # 3. NestJS (craftivo-server)
      # -------------------------
      - name: Setup Node.js for NestJS
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: craftivo-server/package-lock.json

      - name: Install NestJS dependencies
        working-directory: ./craftivo-server
        run: npm ci

      - name: Build NestJS app
        working-directory: ./craftivo-server
        run: npm run build --if-present
