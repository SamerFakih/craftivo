name: Dependency Updates

on:
  schedule:
    # Check for dependency updates weekly on Mondays at 9 AM UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  dependency-check:
    name: Check for Dependency Updates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: |
          cd "craftivo-client" && npm ci
          cd "../craftivo server" && npm ci

      - name: Check outdated packages (backend)
        working-directory: craftivo server
        run: |
          echo "📦 Checking for outdated backend packages..."
          npm outdated > ../backend-outdated.txt || true

      - name: Check outdated packages (frontend)
        working-directory: craftivo-client
        run: |
          echo "📦 Checking for outdated frontend packages..."
          npm outdated > ../frontend-outdated.txt || true

      - name: Create dependency report
        run: |
          echo "# Dependency Update Report" > dependency-report.md
          echo "Generated on: $(date)" >> dependency-report.md
          echo "" >> dependency-report.md

          echo "## Backend Dependencies" >> dependency-report.md
          echo "\`\`\`" >> dependency-report.md
          cat backend-outdated.txt >> dependency-report.md || echo "No outdated backend packages found" >> dependency-report.md
          echo "\`\`\`" >> dependency-report.md
          echo "" >> dependency-report.md

          echo "## Frontend Dependencies" >> dependency-report.md
          echo "\`\`\`" >> dependency-report.md
          cat frontend-outdated.txt >> dependency-report.md || echo "No outdated frontend packages found" >> dependency-report.md
          echo "\`\`\`" >> dependency-report.md

      - name: Upload dependency report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: dependency-report.md
          retention-days: 30
