name: Code Quality

on:
  push:
    branches: [main, dev, develop]
  pull_request:
    branches: [main, dev, develop]

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch full history for better analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          cd "craftivo-client" && npm ci
          cd "../craftivo server" && npm ci

      - name: Check code formatting (backend)
        working-directory: craftivo server
        run: |
          echo "🎨 Checking backend code formatting..."
          npm run format --check || true

      - name: Check code formatting (frontend)
        working-directory: craftivo-client
        run: |
          echo "🎨 Checking frontend code formatting..."
          npx prettier --check "src/**/*.{ts,html,css,scss}" || true

      - name: Run ESLint (backend)
        working-directory: craftivo server
        run: |
          echo "🔍 Running ESLint on backend..."
          npm run lint --format=json --output-file=../backend-lint.json || true

      - name: Run ESLint (frontend)
        working-directory: craftivo-client
        run: |
          echo "🔍 Running ESLint on frontend..."
          npm run ng lint --format=json > ../frontend-lint.json || true

      - name: Analyze bundle size (frontend)
        working-directory: craftivo-client
        run: |
          echo "📊 Analyzing frontend bundle size..."
          npm run build -- --stats-json

      - name: Check TypeScript compilation (backend)
        working-directory: craftivo server
        run: |
          echo "🔧 Checking TypeScript compilation for backend..."
          npx tsc --noEmit

      - name: Check TypeScript compilation (frontend)
        working-directory: craftivo-client
        run: |
          echo "🔧 Checking TypeScript compilation for frontend..."
          npm run ng build -- --configuration=development --dry-run

      - name: Upload quality reports
        uses: actions/upload-artifact@v4
        with:
          name: code-quality-reports
          path: |
            backend-lint.json
            frontend-lint.json
            craftivo-client/dist/craftivo-client/stats.json
          retention-days: 30

      - name: Create quality summary
        run: |
          echo "# Code Quality Summary" > quality-summary.md
          echo "Generated on: $(date)" >> quality-summary.md
          echo "" >> quality-summary.md

          echo "## Linting Results" >> quality-summary.md
          echo "- Backend: ESLint results saved to backend-lint.json" >> quality-summary.md
          echo "- Frontend: ESLint results saved to frontend-lint.json" >> quality-summary.md
          echo "" >> quality-summary.md

          echo "## TypeScript Compilation" >> quality-summary.md
          echo "- All TypeScript files compiled successfully" >> quality-summary.md
          echo "" >> quality-summary.md

          echo "## Bundle Analysis" >> quality-summary.md
          echo "- Frontend bundle analysis available in stats.json" >> quality-summary.md

      - name: Upload quality summary
        uses: actions/upload-artifact@v4
        with:
          name: quality-summary
          path: quality-summary.md
