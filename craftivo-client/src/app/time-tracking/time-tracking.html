<section class="page">
    <header class="head">
        <div>
            <h1 class="title">Time Tracking</h1>
            <p class="subtitle">Track time across projects and manage team productivity.</p>
        </div>
        <button class="btn btn--ghost">
            <svg class="icon" viewBox="0 0 24 24">
                <path d="M3 3h18v2H3V3Zm0 6h18v2H3V9Zm0 6h18v2H3v-2Z" />
            </svg>
            Export Report
        </button>
    </header>

    <!-- Current timer bar -->
    <section class="timer">
        <div class="timer__left">
            <label class="chk">
                <input type="checkbox">
                <span>Current Timer</span>
            </label>
            <strong class="time">{{ currentTime() }}</strong>
        </div>
        <div class="timer__right">
            <select class="select">
                <option>Select project</option>
                <option>E-commerce Redesign</option>
            </select>
            <button class="btn btn--primary">Start</button>
        </div>
    </section>

    <!-- KPIs -->
    <div class="kpis">
        <div class="kpi">
            <div class="kpi__label">Today</div>
            <div class="kpi__value">{{ todayH() }}h</div>
        </div>
        <div class="kpi">
            <div class="kpi__label">This Week</div>
            <div class="kpi__value">{{ weekH() }}h</div>
        </div>
        <div class="kpi">
            <div class="kpi__label">Team Hours</div>
            <div class="kpi__value">{{ teamH() }}h</div>
        </div>
        <div class="kpi">
            <div class="kpi__label">Revenue</div>
            <div class="kpi__value">${{ revenue() | number:'1.0-1' }}</div>
        </div>
    </div>

    <!-- Tabs -->
    <nav class="tabs" role="tablist" aria-label="Time tracking views">
        <button class="tab" [class.tab--active]="tab()==='entries'" (click)="setTab('entries')">Time Entries</button>
        <button class="tab" [class.tab--active]="tab()==='team'" (click)="setTab('team')">Team Overview</button>
        <button class="tab" [class.tab--active]="tab()==='projects'" (click)="setTab('projects')">Project
            Summary</button>
    </nav>

    <!-- Routed-within-page style (but simple ngIf swap) -->
    <app-time-entries *ngIf="tab()==='entries'" [entries]="entries()"></app-time-entries>
    <app-team-overview *ngIf="tab()==='team'" [members]="members()"></app-team-overview>
    <app-project-summary *ngIf="tab()==='projects'" [cards]="projectCards()"></app-project-summary>
</section>
