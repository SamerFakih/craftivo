<div class="signin-container">
    <div class="signin-card">
        <!-- Logo Section -->
        <div class="logo-section">
            <div class="logo-wrapper">
                <img src="/craftivo-logo.png" alt="Craftivo Logo" class="logo">
            </div>
        </div>

        <!-- Welcome Text -->
        <div class="welcome-section">
            <h1>Welcome back</h1>
            <p>Sign in to your freelance command center.</p>
        </div>

        <!-- Sign In Form -->
        <div class="signin-form-container">
            <form [formGroup]="signinForm" (ngSubmit)="onSubmit()" class="signin-form">
                <div class="form-header">
                    <h2>Sign In</h2>
                    <p>Enter your credentials to access your account</p>
                </div>

                <!-- Email Field with FloatLabel -->
                <div class="form-group">
                    <p-floatLabel variant="in">
                        <input pInputText id="email" formControlName="email" class="form-input" />
                        <label for="email">Email</label>
                    </p-floatLabel>
                </div>

                <!-- Password Field with FloatLabel -->
                <div class="form-group">
                    <p-floatLabel variant="in">
                        <input pInputText type="password" id="password" formControlName="password" class="form-input" />
                        <label for="password">Password</label>
                    </p-floatLabel>
                </div>

                <p-button type="submit" label="Sign In" [loading]="isLoading" loadingIcon="pi pi-spinner pi-spin">
                </p-button>

                <!-- Sign Up Link -->
                <div class="signup-link">
                    <p>Don't have an account? <a routerLink="/signup">Sign up</a></p>
                </div>
            </form>
        </div>
    </div>
</div>
