<section class="page">
    <header class="head">
        <div>
            <h1 class="title">Client Management</h1>
            <p class="subtitle">Manage your client relationships and project history</p>
        </div>
        <button class="btn btn--primary">
            <i class="pi pi-user-plus"></i>
            Add Client
        </button>
    </header>

    <div class="searchbar">
        <svg class="icon" viewBox="0 0 24 24">
            <path
                d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5z" />
        </svg>
        <input class="search" type="text" placeholder="Search team members, roles, or skills..." [value]="q()"
            (input)="onSearchInput($event)">
    </div>

    <!-- KPI row -->
    <div class="kpis">
        <div class="kpi">
            <div class="kpi__label">Total Clients</div>
            <div class="kpi__value">{{ totalClients() }}</div>
        </div>
        <div class="kpi">
            <div class="kpi__label">Active Clients</div>
            <div class="kpi__value">{{ activeClients() }}</div>
        </div>
        <div class="kpi">
            <div class="kpi__label">Total Revenue</div>
            <div class="kpi__value">${{ money(totalRevenue()) }}</div>
        </div>
        <div class="kpi">
            <div class="kpi__label">Avg Rating</div>
            <div class="kpi__value">{{ avgRating() }}</div>
        </div>
    </div>

    <!-- List -->
    <div class="list">
        <app-client-card *ngFor="let c of filtered()" [client]="c"></app-client-card>
    </div>
</section>
