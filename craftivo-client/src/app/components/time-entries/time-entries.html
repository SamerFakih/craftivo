<section class="panel">
    <div class="panel__head">
        <div class="head-left">
            <h2>Time Entries</h2>
            <p class="muted">Recent time tracking entries</p>
        </div>
        <div class="head-actions">
            <button class="btn primary" (click)="manual.emit()">
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M11 11V4h2v7h7v2h-7v7h-2v-7H4v-2z" />
                </svg>
                Manual Entry
            </button>
        </div>
    </div>

    <div class="list">
        <article class="row" *ngFor="let e of entries">
            <div class="left">
                <div class="title">
                    <span class="t__text">{{ e.title }}</span>
                    <span class="pill pill--done" *ngIf="e.status==='completed'">completed</span>
                    <span class="pill pill--run" *ngIf="e.status==='running'">running</span>
                </div>
                <div class="meta">
                    <span class="muted">{{ e.project }}</span>
                    <span class="sep">•</span>
                    <span class="muted">{{ e.client }}</span>
                </div>
                <p class="note" *ngIf="e.note">{{ e.note }}</p>
            </div>

            <div class="right">
                <div class="grid">
                    <div class="item"><span class="lbl">Date</span><span>{{ e.dateISO }}</span></div>
                    <div class="item"><span class="lbl">Time</span><span>{{ e.startTime }} - {{ e.endTime }}</span>
                    </div>
                    <div class="item"><span class="lbl">Duration</span><span>{{ e.hours }}h</span></div>
                    <div class="item"><span class="lbl">Amount</span><span>${{ e.amountUSD | number:'1.0-1' }}</span>
                    </div>
                </div>
                <div class="actions">
                    <button class="iconbtn" title="Edit">
                        <i class="pi pi-pencil"></i>
                    </button>
                    <button class="iconbtn" title="Duplicate">
                        <i class="pi pi-copy"></i>
                    </button>
                    <button class="iconbtn" title="Delete">
                        <i class="pi pi-trash"></i>
                    </button>
                </div>
            </div>
        </article>
    </div>
</section>
