<div class="public-sign">
    @if (loading()) { <div class="loading">Loading...</div> }
    @else if (error()) { <div class="error">{{ error() }}</div> }
    @else if (contract()) {
    <h1 class="title">{{ contract()!.title }}</h1>
    <article class="doc" [innerHTML]="html()"></article>
    <div class="sign-box">
        <label>Your Name</label>
        <input type="text" [value]="name()" (input)="name.set($any($event.target).value)" />
        <button class="btn btn--primary" [disabled]="signing() || !name().trim()" (click)="sign()">
            @if (signing()) { Signing... } @else { Sign }
        </button>
    </div>
    }
</div>
