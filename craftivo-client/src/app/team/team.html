<section class="page">
    <header class="head">
        <div>
            <h1 class="title">Team Management</h1>
            <p class="subtitle">Manage your team members and collaboration</p>
        </div>
        <button class="btn btn--primary">
            <i class="pi pi-user-plus"></i>
            Invite Member
        </button>
    </header>

    <div class="searchbar">
        <svg class="icon" viewBox="0 0 24 24">
            <path
                d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5z" />
        </svg>
        <input class="search" type="text" placeholder="Search team members, roles, or skills..." [value]="q()"
            (input)="onSearchInput($event)">
    </div>

    <!-- KPI cards -->
    <div class="kpis">
        <div class="kpi">
            <div class="kpi__label">Total Members</div>
            <div class="kpi__value">{{ totalMembers() }}</div>
        </div>
        <div class="kpi">
            <div class="kpi__label">Active Members</div>
            <div class="kpi__value">{{ activeMembers() }}</div>
        </div>
        <div class="kpi">
            <div class="kpi__label">Total Hours</div>
            <div class="kpi__value">{{ totalHours() }}h</div>
        </div>
        <div class="kpi">
            <div class="kpi__label">Avg Performance</div>
            <div class="kpi__value">{{ avgPerformance() }}</div>
        </div>
    </div>

    <!-- Members list -->
    <div class="list">
        <app-member-card *ngFor="let m of filtered()" [member]="m"></app-member-card>
    </div>
</section>
